services:
  - type: web
    name: sheetsync-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.16.0
      - key: DATABASE_URL
        fromDatabase:
          name: sheetsync-db
          property: connectionString
      - key: API_KEY
        generateValue: true

databases:
  - name: sheetsync-db
    plan: free
    databaseName: sheetsync
    user: sheetsync_user
