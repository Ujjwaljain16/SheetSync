version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/sheetsync
      - API_KEY=secret_12345
      - WEBHOOK_URL=${WEBHOOK_URL}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sheetsync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/superstore_schema.sql:/docker-entrypoint-initdb.d/2-superstore_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/3-seed.sql

volumes:
  postgres_data:
